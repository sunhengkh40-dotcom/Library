apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-frontend
  namespace: laravel-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-frontend
  template:
    metadata:
      labels:
        app: react-frontend
    spec:
      containers:
        - name: react-frontend
          image: react-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: react-frontend
  namespace: laravel-k8s
spec:
  type: LoadBalancer
  selector:
    app: react-frontend
  ports:
    - port: 5173
      targetPort: 5173
