apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-db
  namespace: laravel-k8s
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql-db
  template:
    metadata:
      labels:
        app: mysql-db
    spec:
      containers:
        - name: mysql-db
          image: mysql:8.0
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-secret
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                [
                  "sh",
                  "-c",
                  "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD",
                ]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                [
                  "sh",
                  "-c",
                  "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD",
                ]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-db
  namespace: laravel-k8s
spec:
  selector:
    app: mysql-db
  ports:
    - port: 3306
      targetPort: 3306
