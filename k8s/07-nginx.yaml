apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-server
  namespace: laravel-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-server
  template:
    metadata:
      labels:
        app: nginx-server
    spec:
      containers:
        - name: nginx
          image: nginx-app:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-server
  namespace: laravel-k8s
spec:
  type: LoadBalancer
  selector:
    app: nginx-server
  ports:
    - port: 8000
      targetPort: 80
